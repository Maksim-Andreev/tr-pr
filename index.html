<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Три причины</title>
<!--PWA-->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Три причины">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101320">
<!--/PWA-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,200..500;1,7..72,200..500&family=Manrope:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#101320;
  --ink-deep:#0A0C15;
  --raise:#181D2C;
  --paper:#F1ECE2;
  --paper-dim:#C9C4BC;
  --muted:#7F869C;
  --hair:#252B3D;
  --amber:#E3A857;
  --rose:#CE8179;
  --focus:#E3A857;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100svh;
  background:var(--ink);
  color:var(--paper);
  font-family:"Manrope","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
/* one flourish: lamplight above the page */
body::before{
  content:"";
  position:fixed; inset:0 0 auto 0; height:60vh; pointer-events:none; z-index:0;
  background:radial-gradient(120% 70% at 50% -10%, rgba(227,168,87,.10), rgba(227,168,87,0) 62%);
}
.page{
  position:relative; z-index:1;
  width:100%; max-width:34rem;
  margin:0 auto;
  padding-inline:20px;
  padding-block:max(28px, env(safe-area-inset-top)) max(28px, env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:34px;
  min-height:100svh;
}

/* ---- masthead ---- */
.masthead{display:flex; flex-direction:column; gap:22px; align-items:center; text-align:center}
.ask{
  margin:0;
  font-family:"Literata",Georgia,"Times New Roman",serif;
  font-style:italic; font-weight:300;
  font-size:1.0625rem; line-height:1.4;
  color:var(--muted);
  letter-spacing:.01em;
}
.datebar{display:flex; align-items:center; justify-content:center; gap:6px; width:100%}
.playall{
  background:none; border:0; padding:2px 0; cursor:pointer;
  font-family:"Manrope",sans-serif; font-size:.625rem; font-weight:600;
  letter-spacing:.2em; text-transform:uppercase; color:var(--muted);
  transition:color .2s;
}
.playall:hover, .playall.is-on{color:var(--amber)}
.playall[hidden]{display:none}
.nav{
  flex:0 0 auto;
  width:40px; height:40px; border-radius:50%;
  display:grid; place-items:center;
  background:transparent; border:1px solid var(--hair); color:var(--paper-dim);
  font-size:1rem; line-height:1; cursor:pointer;
  transition:border-color .2s, color .2s, background .2s;
}
.nav:hover:not(:disabled){border-color:var(--amber); color:var(--amber)}
.nav:disabled{opacity:.25; cursor:default}
.nav svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.datewrap{flex:1 1 auto; min-width:0}
.date{
  margin:0;
  font-family:"Manrope",sans-serif; font-weight:500;
  font-size:.8125rem; letter-spacing:.14em; text-transform:uppercase;
  color:var(--paper);
}
.daycount{
  margin:5px 0 0;
  font-family:"Manrope",sans-serif; font-size:.6875rem; font-weight:400;
  letter-spacing:.16em; text-transform:uppercase; color:var(--muted);
  font-variant-numeric:tabular-nums;
}

/* ---- the answer ---- */
.answer{display:flex; flex-direction:column; flex:1 1 auto}
.reason{
  display:grid; grid-template-columns:1fr auto; align-items:start;
  column-gap:14px; row-gap:10px;
  padding-block:26px;
}
.acts{
  grid-column:2; align-self:end;
  display:flex; align-items:center; gap:1px;
  margin:-4px -6px -4px 0;
}
.prog{grid-column:1 / -1; height:1px; background:var(--hair); margin-top:16px; display:none}
.reason.is-playing .prog{display:block}
.prog i{display:block; height:1px; background:var(--amber); width:0; transition:width .2s linear}
.reason.is-playing .ord{color:var(--amber)}
.reason + .reason{border-top:1px solid var(--hair)}
.reason:first-child{padding-top:4px}
.ord{
  grid-column:1 / -1;
  font-family:"Manrope",sans-serif; font-size:.625rem; font-weight:600;
  letter-spacing:.22em; text-transform:uppercase;
  color:var(--muted);
}
.reason--special .ord{color:var(--amber)}
.rtext{
  grid-column:1; margin:0;
  font-family:"Literata",Georgia,"Times New Roman",serif;
  font-weight:350;
  font-size:clamp(1.3125rem,4.9vw,1.625rem);
  line-height:1.42; letter-spacing:.004em;
  color:var(--paper);
  text-wrap:pretty;
}
.reason--special:first-child .rtext{font-style:italic}
.play{
  width:34px; height:34px;
  display:grid; place-items:center;
  background:none; border:0; cursor:pointer; color:var(--muted);
  transition:color .2s, transform .2s;
  -webkit-tap-highlight-color:transparent;
}
.play .i-play{fill:currentColor; stroke:none}
.play .i-pause{fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round}
.play svg{width:17px; height:17px}
.play .i-pause{display:none}
.reason.is-playing .play{color:var(--amber)}
.reason.is-playing .play .i-play{display:none}
.reason.is-playing .play .i-pause{display:block}
.play:hover{color:var(--amber)}
.play:active{transform:scale(.88)}
.fav{
  width:34px; height:34px;
  display:grid; place-items:center;
  background:none; border:0; cursor:pointer; color:var(--muted);
  transition:color .2s, transform .2s;
  -webkit-tap-highlight-color:transparent;
}
.fav svg{width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.5; transition:fill .2s}
.fav:hover{color:var(--rose)}
.fav[aria-pressed="true"]{color:var(--rose)}
.fav[aria-pressed="true"] svg{fill:var(--rose)}
.fav:active{transform:scale(.88)}

/* entrance */
@media (prefers-reduced-motion:no-preference){
  .reason{animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
  .reason:nth-child(1){animation-delay:.02s}
  .reason:nth-child(2){animation-delay:.12s}
  .reason:nth-child(3){animation-delay:.22s}
}
@keyframes rise{from{opacity:0; transform:translateY(9px)} to{opacity:1; transform:none}}

/* ---- footer ---- */
.foot{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding-top:20px; border-top:1px solid var(--hair);
}
.saved-btn{
  background:none; border:0; padding:6px 0; cursor:pointer;
  font-family:"Manrope",sans-serif; font-size:.6875rem; font-weight:600;
  letter-spacing:.16em; text-transform:uppercase; color:var(--muted);
  transition:color .2s;
}
.saved-btn:hover{color:var(--rose)}
.sign{
  margin:0;
  font-family:"Literata",Georgia,serif; font-style:italic; font-weight:300;
  font-size:1rem; color:var(--paper-dim);
}

/* ---- saved sheet ---- */
.sheet{
  position:fixed; inset:0; z-index:10;
  background:rgba(10,12,21,.72);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  display:flex; align-items:flex-end; justify-content:center;
}
.sheet[hidden]{display:none}
.sheet-inner{
  width:100%; max-width:34rem; max-height:86svh;
  background:var(--raise); border-top:1px solid var(--hair);
  border-radius:18px 18px 0 0;
  padding:22px 20px max(22px, env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:14px;
  animation:slideup .3s cubic-bezier(.2,.7,.3,1) both;
}
@media (prefers-reduced-motion:reduce){.sheet-inner{animation:none}}
@keyframes slideup{from{transform:translateY(14px);opacity:0} to{transform:none;opacity:1}}
.sheet-head{display:flex; align-items:center; justify-content:space-between; gap:12px}
.sheet-title{
  margin:0; font-family:"Manrope",sans-serif; font-size:.6875rem; font-weight:600;
  letter-spacing:.2em; text-transform:uppercase; color:var(--muted);
}
.close{
  background:none; border:0; color:var(--paper-dim); cursor:pointer;
  font-size:1.25rem; line-height:1; padding:4px 6px;
}
.close:hover{color:var(--paper)}
.saved-list{
  list-style:none; margin:0; padding:0 2px 2px 0;
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  display:flex; flex-direction:column;
}
.saved-list li{padding-block:16px}
.saved-list li + li{border-top:1px solid var(--hair)}
.saved-list p{
  margin:0; font-family:"Literata",Georgia,serif; font-weight:300;
  font-size:1.0625rem; line-height:1.45; color:var(--paper);
}
.saved-list time{
  display:block; margin-top:7px;
  font-family:"Manrope",sans-serif; font-size:.625rem; letter-spacing:.16em;
  text-transform:uppercase; color:var(--muted);
}
.empty{
  margin:0; padding-block:26px 10px;
  font-family:"Literata",Georgia,serif; font-style:italic; font-weight:300;
  font-size:1.0625rem; color:var(--muted);
}
:focus-visible{outline:2px solid var(--focus); outline-offset:3px; border-radius:3px}
</style>
</head>
<body>

<main class="page">
  <header class="masthead">
    <p class="ask" id="ask">&laquo;Почему ты меня любишь?&raquo;</p>
    <div class="datebar">
      <button class="nav" id="prev" type="button" aria-label="Предыдущий день">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="datewrap">
        <h1 class="date" id="date">&nbsp;</h1>
        <p class="daycount" id="daycount">&nbsp;</p>
      </div>
      <button class="nav" id="next" type="button" aria-label="Следующий день">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
    <button class="playall" id="playAll" type="button" hidden>Слушать всё</button>
  </header>

  <section class="answer" id="answer" aria-live="polite"></section>

  <footer class="foot">
    <button class="saved-btn" id="savedBtn" type="button">Сохранённое &middot; <span id="savedCount">0</span></button>
    <p class="sign" id="sign"></p>
  </footer>
</main>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-inner">
    <div class="sheet-head">
      <h2 class="sheet-title" id="sheetTitle">Сохранённое</h2>
      <button class="close" id="closeSheet" type="button" aria-label="Закрыть">&times;</button>
    </div>
    <ul class="saved-list" id="savedList"></ul>
  </div>
</div>

<script>
(function(){
  "use strict";

  var DEFAULT_DATA = {"_readme":"Единственный файл, который нужно редактировать. Новые причины добавляй В КОНЕЦ списка: { \"id\": \"009\", \"t\": \"...\" }. id больше никогда не меняется — по нему находится запись голоса: audio/009.wav","_special":"special[] закрепляет причину за датой: \"ММ-ДД\" каждый год, \"ГГГГ-ММ-ДД\" один раз.","_audio":"Файлы в audio/ называются по id: 001.wav ... Записать новые можно через studio.html.","audio":true,"audioExt":"wav","her":"","signature":"Максим","startDate":"2026-09-17","special":[],"reasons":[{"id":"001","t":"Потому что ты меня любишь"},{"id":"002","t":"Потому что ты меня всегда поддерживаешь"},{"id":"003","t":"Потому что ты придумала самую короткую версию моего имени: Ма"},{"id":"004","t":"Потому что ты придумала называть меня Матыячи"},{"id":"005","t":"Потому что ты всегда меня встречаешь и провожаешь с работы"},{"id":"006","t":"Потому что ты не даёшь мне спать, пока я не почищу зубы"},{"id":"007","t":"Потому что ты спасла меня от таракана"},{"id":"008","t":"Потому что ты всегда спрашиваешь, люблю ли я тебя и просишь назвать причины"}]};
  var DAY = 86400000;
  var ORD = ["первая","вторая","третья"];
  var KEY_FAV  = "tr.favs.v1";
  var KEY_HIST = "tr.hist.v2";

  var data = DEFAULT_DATA;
  var dataReady = false;
  var viewing = null, today = null, start = null;
  var current = [];                 // the three entries on screen
  var missing = {};                 // ids whose recording 404s (memory only, retried next load)

  /* ---------- storage (never let a private window break the app) ---------- */
  function load(k, fb){
    try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; }catch(e){ return fb; }
  }
  function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  var favs = load(KEY_FAV, []);
  var hist = load(KEY_HIST, {});

  /* ---------- dates: everything normalised to UTC midnight ---------- */
  function parseISO(s){
    var p = String(s || "").split("-");
    return Date.UTC(+p[0], (+p[1] || 1) - 1, +p[2] || 1);
  }
  function todayUTC(){ var n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()); }
  function iso(ms){ return new Date(ms).toISOString().slice(0,10); }
  function mmdd(ms){ return iso(ms).slice(5); }

  /* A reason is {id, t}. Plain strings still work - they just have no recording. */
  function norm(e){
    if (typeof e === "string") return { id:null, t:e };
    return { id: e.id || null, t: e.t || e.text || "" };
  }

  /* ---------- deterministic deck ----------
     The same date always deals the same three, on every device,
     with no repeat until the whole list has been used once.        */
  function mulberry32(a){
    return function(){
      a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var deckCache = {};
  function deck(n, cycle){
    var key = n + ":" + cycle;
    if (deckCache[key]) return deckCache[key];
    var rnd = mulberry32((cycle + 1) * 2654435761 ^ (n * 40503));
    var a = []; for (var i = 0; i < n; i++) a.push(i);
    for (var j = n - 1; j > 0; j--){
      var k = Math.floor(rnd() * (j + 1));
      var t = a[j]; a[j] = a[k]; a[k] = t;
    }
    deckCache[key] = a; return a;
  }
  function pick(dayIndex){
    var list = data.reasons || [], n = list.length;
    if (!n) return [];
    var out = [], seen = {}, q = dayIndex * 3, guard = 0;
    while (out.length < 3 && guard++ < n * 3){
      var idx = deck(n, Math.floor(q / n))[((q % n) + n) % n];
      if (!seen[idx]){ seen[idx] = 1; out.push(norm(list[idx])); }
      q++;
    }
    return out;
  }

  function reasonsFor(ms){
    var key = iso(ms);
    if (hist[key]) return hist[key].map(norm);

    var three = pick(Math.round((ms - start) / DAY));
    var sp = (data.special || []).filter(function(s){
      var on = String(s.on || "");
      return on === key || on === mmdd(ms);
    }).map(norm);
    if (sp.length){
      var taken = {};
      sp.forEach(function(e){ taken[e.t] = 1; });
      three = sp.concat(three.filter(function(e){ return !taken[e.t]; })).slice(0, 3);
    }
    // Lock in what she actually saw, so the archive never rewrites itself
    // when new reasons are added to the list later.
    if (dataReady && ms <= today){ hist[key] = three; save(KEY_HIST, hist); }
    return three;
  }
  function isSpecial(text){
    return (data.special || []).some(function(s){ return (s.t || s.text) === text; });
  }

  /* ---------- his voice ----------
     One <audio> element for the whole app: iOS unlocks it on her first tap
     and every clip after that plays without another one.            */
  var player = new Audio();
  player.preload = "none";
  var playingId = null;
  var queue = [], qi = -1, gapTimer = null;

  function srcFor(id){ return "audio/" + id + "." + (data.audioExt || "wav"); }
  function hasAudio(e){ return !!(data.audio && e.id && !missing[e.id]); }

  function stopAudio(){
    clearTimeout(gapTimer);
    try{ player.pause(); }catch(e){}
    playingId = null; queue = []; qi = -1;
    paint();
  }
  function playId(id){
    clearTimeout(gapTimer);
    playingId = id;
    player.src = srcFor(id);
    var p = player.play();
    if (p && p.catch) p.catch(function(){ onFail(); });
    paint();
  }
  function advance(){
    qi++;
    if (qi < queue.length) playId(queue[qi]);
    else stopAudio();
  }
  function onFail(){
    // No recording for this one yet: drop its button rather than leave a
    // control that does nothing, and carry on with the rest.
    if (playingId){
      missing[playingId] = 1;
      var b = document.querySelector('.reason[data-id="' + playingId + '"] .play');
      if (b) b.remove();
      $("playAll").hidden = !current.some(hasAudio);
    }
    if (queue.length) advance(); else stopAudio();
  }
  player.addEventListener("error", onFail);
  player.addEventListener("ended", function(){
    if (!queue.length){ stopAudio(); return; }
    gapTimer = setTimeout(advance, 500);          // a beat between reasons
  });
  player.addEventListener("timeupdate", function(){
    var el = playingId && document.querySelector('.reason[data-id="' + playingId + '"] .prog i');
    if (el && player.duration) el.style.width = (player.currentTime / player.duration * 100) + "%";
  });

  /* ---------- render ---------- */
  var $ = function(id){ return document.getElementById(id); };
  var fmt = new Intl.DateTimeFormat("ru-RU", {weekday:"long", day:"numeric", month:"long", timeZone:"UTC"});
  var fmtShort = new Intl.DateTimeFormat("ru-RU", {day:"numeric", month:"long", year:"numeric", timeZone:"UTC"});

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }
  function isFav(text){ return favs.some(function(f){ return f.text === text; }); }

  var ICON_HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.5-7-9.2A4 4 0 0 1 12 8a4 4 0 0 1 7 2.8C19 15.5 12 20 12 20z"/></svg>';
  var ICON_PLAY  = '<svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>'
                 + '<svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.5v13M15.5 5.5v13"/></svg>';

  function render(){
    var ms = viewing;
    current = reasonsFor(ms);
    var idx = Math.round((ms - start) / DAY);

    $("date").textContent = fmt.format(new Date(ms));
    $("daycount").textContent = ms === today ? "Сегодня · День " + (idx + 1) : "День " + (idx + 1);
    $("prev").disabled = ms <= start;
    $("next").disabled = ms >= today;

    $("answer").innerHTML = current.map(function(e, i){
      var voice = hasAudio(e);
      return '<article class="reason' + (isSpecial(e.t) ? " reason--special" : "") + '"'
        + (e.id ? ' data-id="' + esc(e.id) + '"' : "") + '>'
        + '<span class="ord">' + ORD[i] + '</span>'
        + '<p class="rtext">' + esc(e.t) + '</p>'
        + '<div class="acts">'
        + (voice ? '<button class="play" type="button" aria-label="Слушать">' + ICON_PLAY + '</button>' : "")
        + '<button class="fav" type="button" data-text="' + esc(e.t) + '" '
        + 'aria-pressed="' + (isFav(e.t) ? "true" : "false") + '" aria-label="Сохранить">' + ICON_HEART + '</button>'
        + '</div>'
        + '<div class="prog"><i></i></div>'
        + '</article>';
    }).join("");

    $("savedCount").textContent = favs.length;
    $("playAll").hidden = !current.some(hasAudio);
    paint();
  }

  /* Repaint only what playback changes, so the entrance animation
     and her scroll position survive. */
  function paint(){
    var nodes = $("answer").querySelectorAll(".reason");
    for (var i = 0; i < nodes.length; i++){
      var on = nodes[i].getAttribute("data-id") === playingId;
      nodes[i].classList.toggle("is-playing", on);
      if (!on){
        var bar = nodes[i].querySelector(".prog i");
        if (bar) bar.style.width = "0%";
      }
      var b = nodes[i].querySelector(".play");
      if (b) b.setAttribute("aria-label", on ? "Пауза" : "Слушать");
    }
    var all = $("playAll");
    all.textContent = queue.length ? "Остановить" : "Слушать всё";
    all.classList.toggle("is-on", !!queue.length);
  }

  function go(deltaDays){
    var t = viewing + deltaDays * DAY;
    if (t < start || t > today) return;
    stopAudio();
    viewing = t;
    render();
  }

  /* ---------- saved ---------- */
  function renderSaved(){
    var list = $("savedList");
    if (!favs.length){
      list.innerHTML = '<li><p class="empty">Пока пусто. Нажми на сердечко рядом с любой причиной — она останется здесь.</p></li>';
      return;
    }
    list.innerHTML = favs.slice().reverse().map(function(f){
      return '<li><p>' + esc(f.text) + '</p><time datetime="' + esc(f.date) + '">'
        + fmtShort.format(new Date(parseISO(f.date))) + '</time></li>';
    }).join("");
  }

  /* ---------- events ---------- */
  $("prev").addEventListener("click", function(){ go(-1); });
  $("next").addEventListener("click", function(){ go(1); });

  $("answer").addEventListener("click", function(e){
    var play = e.target.closest(".play");
    if (play){
      var id = play.closest(".reason").getAttribute("data-id");
      if (playingId === id && !player.paused) stopAudio();
      else { queue = []; qi = -1; playId(id); }
      return;
    }
    var btn = e.target.closest(".fav");
    if (!btn) return;
    var text = btn.getAttribute("data-text");
    var i = favs.findIndex(function(f){ return f.text === text; });
    if (i >= 0) favs.splice(i, 1); else favs.push({ text: text, date: iso(viewing) });
    save(KEY_FAV, favs);
    btn.setAttribute("aria-pressed", i >= 0 ? "false" : "true");
    $("savedCount").textContent = favs.length;
  });

  $("playAll").addEventListener("click", function(){
    if (queue.length){ stopAudio(); return; }
    var ids = current.filter(hasAudio).map(function(e){ return e.id; });
    if (!ids.length) return;
    queue = ids; qi = 0; playId(ids[0]);
  });

  $("savedBtn").addEventListener("click", function(){
    renderSaved(); $("sheet").hidden = false; $("closeSheet").focus();
  });
  function closeSheet(){ $("sheet").hidden = true; $("savedBtn").focus(); }
  $("closeSheet").addEventListener("click", closeSheet);
  $("sheet").addEventListener("click", function(e){ if (e.target === $("sheet")) closeSheet(); });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && !$("sheet").hidden) return closeSheet();
    if (!$("sheet").hidden) return;
    if (e.key === "ArrowLeft") go(-1);
    if (e.key === "ArrowRight") go(1);
  });

  var sx = 0, sy = 0;
  document.addEventListener("touchstart", function(e){
    sx = e.changedTouches[0].clientX; sy = e.changedTouches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6) go(dx < 0 ? 1 : -1);
  }, {passive:true});

  /* ---------- boot ---------- */
  function applyData(d){
    data = d;
    start = parseISO(d.startDate);
    today = todayUTC();
    if (today < start) today = start;
    if (viewing === null || viewing > today || viewing < start) viewing = today;
    $("ask").innerHTML = d.her
      ? "&laquo;" + esc(d.her) + ", почему ты меня любишь?&raquo;"
      : "&laquo;Почему ты меня любишь?&raquo;";
    $("sign").textContent = d.signature ? "— " + d.signature : "";
    render();
  }

  applyData(DEFAULT_DATA);

  fetch("reasons.json", { cache: "no-cache" })
    .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
    .then(function(d){ dataReady = true; applyData(d); })
    .catch(function(){ dataReady = true; render(); });

  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState !== "visible") return;
    var t = todayUTC();
    if (t !== today){ var wasToday = viewing === today; today = t; if (wasToday) viewing = t; stopAudio(); render(); }
  });
})();
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
